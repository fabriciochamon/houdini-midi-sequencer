<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- Background MIDI Grid Lanes -->
  <g stroke="#3a3a3a" stroke-width="1" opacity="0.5">
    <line x1="4" y1="12" x2="44" y2="12" />
    <line x1="4" y1="20" x2="44" y2="20" />
    <line x1="4" y1="28" x2="44" y2="28" />
    <line x1="4" y1="36" x2="44" y2="36" />
  </g>

  <!-- Original MIDI Notes (Left) -->
  <g stroke="#1a1a1a" stroke-width="1.5" stroke-linejoin="round">
    <rect x="6" y="13" width="11" height="5" rx="1" fill="#ff595e" />
    <rect x="10" y="21" width="9" height="5" rx="1" fill="#ffca3a" />
    <rect x="6" y="29" width="12" height="5" rx="1" fill="#8ac926" />
  </g>

  <!-- Repeated MIDI Notes (Right - Matching Row Colors) -->
  <g stroke="#1a1a1a" stroke-width="1.5" stroke-linejoin="round">
    <rect x="27" y="13" width="11" height="5" rx="1" fill="#ff595e" />
    <rect x="31" y="21" width="9" height="5" rx="1" fill="#ffca3a" />
    <rect x="27" y="29" width="12" height="5" rx="1" fill="#8ac926" />
  </g>

  <!-- Repeat / Loop Arrow Indicator -->
  <g fill="none" stroke="#4da6ff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top Loop Path -->
    <path d="M 15 9 C 18 4, 30 4, 33 9" />
    <polyline points="30 9 33.5 9.5 34 6" />
    
    <!-- Bottom Return Path -->
    <path d="M 33 39 C 30 44, 18 44, 15 39" />
    <polyline points="18 39 14.5 38.5 14 42" />
  </g>
</svg>
