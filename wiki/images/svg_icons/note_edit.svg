<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- CONJUNTO DA NOTA MUSICAL PRINCIPAL (Proporções Alongadas) -->
  <!-- Bandeira/Haste superior azul com contorno cinza escuro grosso -->
  <path d="M 28 20 L 62 10 L 62 25 L 28 35 Z" fill="#008be3" stroke="#333333" stroke-width="5" stroke-linejoin="round"/>
  
  <!-- Haste esquerda alongada -->
  <line x1="28" y1="20" x2="28" y2="70" stroke="#333333" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Haste direita alongada -->
  <line x1="62" y1="10" x2="62" y2="60" stroke="#333333" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Cabeça da nota esquerda (rotacionada) -->
  <ellipse cx="20" cy="70" rx="9" ry="6" transform="rotate(-25 20 70)" fill="#000000" stroke="#333333" stroke-width="4"/>
  
  <!-- Cabeça da nota direita (rotacionada) -->
  <ellipse cx="54" cy="60" rx="9" ry="6" transform="rotate(-25 54 60)" fill="#000000" stroke="#333333" stroke-width="4"/>

  <!-- EMBLEMA DO CÍRCULO LARANJA (EDIT) -->
  <circle cx="73" cy="70" r="19" fill="#ff6d00" stroke="#333333" stroke-width="5"/>
  
  <!-- Lápis interno -->
  <g transform="translate(73, 70) rotate(-45) translate(-10, -15)">
    <path d="M 4 22 L 4 6 A 6 6 0 0 1 16 6 L 16 22 L 10 28 Z" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <line x1="4" y1="10" x2="16" y2="10" stroke="#ffffff" stroke-width="3"/>
  </g>
</svg>
